onboarding = false
# Herdr is managed by Nix, but its runtime config stays in the dotfiles
# checkout so the same setup is available on every configured host.

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "symbols"
pane_scrollbars = true
pane_gaps = true
hide_tab_bar_when_single_tab = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true

[keys]
prefix = "super+space"

focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]
previous_tab = ["prefix+["]
next_tab = ["prefix+]"]
new_tab = ["prefix+t"]
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+s"]
zoom = ["prefix+z"]

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

[[keys.command]] # lazygit: open in a split
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit"

[[keys.command]] # lazygit: open in its own tab
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
description = "lazygit (tab)"
