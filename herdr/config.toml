onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[theme]
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "symbols"
pane_scrollbars = true
pane_gaps = true
hide_tab_bar_when_single_tab = false
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[session]
resume_agents_on_restore = false

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true

[keys]
prefix = "super+space"

# General
help = "prefix+?"
settings = "prefix+comma"

# Panes -------------------------------------------------------
# Direct movement: Super scopes Ctrl+hjkl to the terminal layer.
focus_pane_left = "super+ctrl+h"
focus_pane_down = "super+ctrl+j"
focus_pane_up = "super+ctrl+k"
focus_pane_right = "super+ctrl+l"

# Lifecycle / manipulation.
close_pane = "prefix+d"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
zoom = "prefix+m"
resize_mode = "prefix+r"

# Tabs --------------------------------------------------------
# Direct movement: tabs are 1D siblings.
previous_tab = "super+shift+h"
next_tab = "super+shift+l"

# Lifecycle.
new_tab = "prefix+shift+n"
close_tab = "prefix+shift+d"

# Indexed navigation.
switch_tab = "prefix+shift+1..9"

# Workspaces --------------------------------------------------
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

new_workspace = "prefix+ctrl+n"
close_workspace = "prefix+ctrl+d"
new_worktree = "prefix+ctrl+t"

# Shift+number = same positional idea, one level above tabs.
switch_workspace = "prefix+ctrl+1..9"

# Agents / sidebar --------------------------------------------
toggle_sidebar = "prefix+e"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "herdr-workspacer.open"
description = "open workspace picker"
