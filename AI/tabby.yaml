# https://tabby.tabbyml.com/docs/welcome/
#
# Tabby serves completions from a separate llama-server rather than its own
# bundled runtime, so the inference build can be pinned independently of
# Tabby's release cadence: Mellum2 needs llama.cpp >= b9485 (2026-06-02) and
# Tabby's newest release (v0.32.0, 2026-01) vendors a much older one.
#
# Exactly one fim-* service runs at a time. They share the `fim` network alias,
# so Tabby's api_endpoint never changes when swapping models -- only the
# prompt_template does, and nix renders one config per model (see
# nix/modules/ai/tabby.nix). The `fim` profile keeps them out of a bare `up`;
# start one explicitly by name:
#
#   docker compose --file AI/tabby.yaml up --detach fim-mellum
#
# nvim's <leader>uL picker drives this; see nvim/lua/plugins/AI.lua.
name: tabby

x-fim: &fim
  # Not unless-stopped: these are started explicitly (by the picker or by
  # name), and a daemon restart bringing a stale one back would leave two
  # containers sharing the `fim` alias, round-robining Tabby between two
  # different models. Crashes should stay visible rather than loop.
  restart: "no"
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10156
  profiles: [fim]
  # HF_HOME, not LLAMA_CACHE: -hf downloads land in the huggingface hub cache
  # layout ($HF_HOME/hub/models--<org>--<repo>/blobs), verified against
  # llama-server b9190. LLAMA_CACHE is set too since older builds honour it.
  environment:
    HF_HOME: /models
    LLAMA_CACHE: /models
  # Shares the host's huggingface cache rather than a private volume. llama.cpp
  # names blobs by the manifest layer digest, which is byte-identical to the
  # file's LFS oid -- so `hf download <repo> <file>` writes exactly the path
  # -hf looks for, and pre-warming works:
  #
  #   hf download ravizhan/Mellum-4b-sft-all-gguf Mellum-4b-sft-all.Q4_K_S.gguf
  #
  # That runs ~13MB/s (parallel chunks) against ~1-3MB/s for -hf's single
  # connection, and avoids a second 4.5GB copy inside a docker volume.
  volumes:
    - "$HOME/.cache/huggingface:/models"
  # Runs as the invoking user so cached blobs stay writable by `hf download`
  # on the host; the image would otherwise write them as root.
  user: "${UID:-1000}:${GID:-1000}"
  networks:
    default:
      aliases:
        - fim
  healthcheck:
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8082/health
    interval: 5s
    timeout: 5s
    retries: 120
    start_period: 30s
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  # Current baseline. Pretrained FIM, never post-trained for completion
  # stopping behaviour -- the thing the Mellum variants are tuned for.
  fim-qwen:
    <<: *fim
    command:
      - -hf
      - QuantFactory/Qwen2.5-Coder-1.5B-GGUF:Q6_K
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - auto
      # One slot, not llama-server's default 4: this serves a single editor,
      # and 4 slots both quadruple the KV allocation and round-robin requests
      # so consecutive keystrokes miss each other's cached prefix.
      - --parallel
      - "1"
      # Autocomplete re-requests a prefix that grew by a few tokens; reusing
      # the previous KV instead of re-prefilling is the whole game.
      - --cache-reuse
      - "256"

  # Mellum-4b-sft-all: the multi-language SFT variant (SAFIM 52.86, chrF++
  # 74.22, KK 0.63). 8k context is an architectural cap, not a tuning choice.
  fim-mellum:
    <<: *fim
    command:
      - -hf
      - ravizhan/Mellum-4b-sft-all-gguf:Q4_K_S
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - auto
      # One slot, not llama-server's default 4: this serves a single editor,
      # and 4 slots both quadruple the KV allocation and round-robin requests
      # so consecutive keystrokes miss each other's cached prefix.
      - --parallel
      - "1"
      # Autocomplete re-requests a prefix that grew by a few tokens; reusing
      # the previous KV instead of re-prefilling is the whole game.
      - --cache-reuse
      - "256"

  # Mellum2 Base: 12B MoE, 2.5B active per token. Community GGUF -- JetBrains
  # ships official quants only for Instruct/Thinking, which are post-trained
  # away from FIM. No published infilling benchmarks exist for this model.
  fim-mellum2:
    <<: *fim
    command:
      - -hf
      - mradermacher/Mellum2-12B-A2.5B-Base-GGUF:Q4_K_S
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - --ctx-size
      - "4096"
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - auto
      # One slot, not llama-server's default 4: this serves a single editor,
      # and 4 slots both quadruple the KV allocation and round-robin requests
      # so consecutive keystrokes miss each other's cached prefix.
      - --parallel
      - "1"
      # Autocomplete re-requests a prefix that grew by a few tokens; reusing
      # the previous KV instead of re-prefilling is the whole game.
      - --cache-reuse
      - "256"

  tabby:
    restart: unless-stopped
    image: registry.tabbyml.com/tabbyml/tabby
    # No --model: completions come from the fim-* service via
    # [model.completion.http]. --device still applies to the embedding model
    # backing the repository index below.
    command: serve --device cuda
    volumes:
      - "$HOME/.tabby:/data"
      - "$HOME/dotfiles:/repositories/dotfiles:ro"
      - "$HOME/Projects:/repositories/Projects:ro"
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/metrics
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    # Completion inference lives in a separate fim-* service, but Tabby still
    # runs its bundled llama-server for repository embeddings. Give that
    # process access to libcuda and the GPU too.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
