# Token prices in USD per million tokens.
#
# Cost is computed when a report runs and is never stored on a run. The
# question these prices answer is which configuration to use next, so every
# comparison must reflect today's rates rather than the rates in force when a
# run happened. Refreshing a rate therefore re-ranks the whole history on
# purpose; a stale table quietly recommends the wrong model.
#
# Add a scheduled price change as another [[model]] entry with a later
# effective_from. The report selects the newest entry that has already taken
# effect, so a known future change needs no action on the day it lands.
#
# Token counts are only comparable within a model generation: Claude 4.7 and
# later use a tokenizer producing roughly 30% more tokens for the same text,
# so re-pricing an old run against a different model is meaningless. Against
# new rates for the same model it is exact.

[meta]
retrieved = 2026-08-08
staleness_days = 30

[[model]]
profile = "claude"
name = "haiku"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 1.0
cache_write = 1.25
cache_read = 0.10
output = 5.0

[[model]]
profile = "claude"
name = "sonnet"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 2.0
cache_write = 2.50
cache_read = 0.20
output = 10.0

# Sonnet 5 introductory pricing ends 2026-08-31; standard rates follow.
[[model]]
profile = "claude"
name = "sonnet"
effective_from = 2026-09-01
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 3.0
cache_write = 3.75
cache_read = 0.30
output = 15.0

[[model]]
profile = "claude"
name = "opus"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 5.0
cache_write = 6.25
cache_read = 0.50
output = 25.0

[[model]]
profile = "claude"
name = "fable"
source = "https://platform.claude.com/docs/en/about-claude/pricing"
input = 10.0
cache_write = 12.50
cache_read = 1.00
output = 50.0

# Codex rates are the short-context tier. OpenAI charges roughly double for
# requests above the long-context threshold (sol goes to $10 input / $45
# output), and a run's metrics do not record which tier each request billed
# at, so a long-context-heavy run is under-costed here. That understates the
# expensive models more than the cheap ones, which makes this table a
# conservative floor for the ranking rather than a neutral one.
#
# Luna fell about 80% on 2026-07-30, so treat large moves in this family as
# plausible rather than as a transcription error.
[[model]]
profile = "codex"
name = "gpt-5.6-luna"
source = "https://developers.openai.com/api/docs/pricing"
input = 0.20
cache_write = 0.25
cache_read = 0.02
output = 1.20

[[model]]
profile = "codex"
name = "gpt-5.6-terra"
source = "https://developers.openai.com/api/docs/pricing"
input = 2.0
cache_write = 2.50
cache_read = 0.20
output = 12.0

[[model]]
profile = "codex"
name = "gpt-5.6-sol"
source = "https://developers.openai.com/api/docs/pricing"
input = 5.0
cache_write = 6.25
cache_read = 0.50
output = 30.0
