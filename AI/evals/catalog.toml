# Master evaluation configuration.
#
# Compute defaults apply when a run omits --model or --effort. Instruction
# entries connect one monitored fragment to a behavioral hypothesis and the
# cases that exercise it. Set `enabled = false` to exclude a fragment from
# comparison campaigns without deleting its entry. Components are discovered
# from the repository and tracked in manifests regardless of this file; an
# entry whose fragment file was deleted fails eval-plan and eval-coverage.

# Measured on 2026-08-08 across three extended runs on the current
# configuration. Pooled adherence tracked model strength exactly: sol at low
# effort scored 66.3, terra at medium 57.1, and luna at high 53.4. Raising
# effort did not recover a weaker band, so the default keeps the strongest
# model at the cheapest effort.
[defaults.codex]
model = "gpt-5.6-sol"
effort = "low"

# Measured on 2026-08-08 across four extended runs on the current
# configuration. Opus at low effort matched opus at medium on pooled
# adherence (54.7 against 57.1, inside the error band) while running 30%
# faster on 37% fewer output tokens, and beat sonnet at medium effort on
# every axis. Raising effort bought little: model band, not reasoning
# effort, moved rule-following behaviour.
[defaults.claude]
model = "opus"
effort = "low"

[instruction.documentation]
enabled = true
maturity = "active"
hypothesis = "Documentation instructions improve durable project guidance."
cases = ["homeops-maintenance-visibility"]

[instruction.git]
enabled = true
maturity = "active"
hypothesis = "Git instructions preserve user state and produce reviewable handoffs."
cases = ["homeops-worktree-handoff"]

[instruction.planning]
enabled = true
maturity = "active"
hypothesis = "Planning instructions invoke the configured planning agent for complex work without adding delegation overhead to narrow tasks."
cases = [
  "homeops-workload-health-overreach",
  "homeops-maintenance-visibility",
]

[instruction.tools]
enabled = true
maturity = "proven"
hypothesis = "Tool instructions improve command and parser selection without hurting task success."
cases = [
  "homeops-workload-health-overreach",
  "homeops-authorized-gitops-dns-remediation",
  "homeops-maintenance-visibility",
  "homeops-readonly-gitops-dns-diagnosis",
  "homeops-template-structure-exploration",
]

[instruction.workflow]
enabled = true
maturity = "active"
hypothesis = "Workflow instructions produce narrow verified changes while preserving unrelated state."
cases = [
  "homeops-workload-health-overreach",
  "homeops-authorized-gitops-dns-remediation",
  "homeops-maintenance-visibility",
  "homeops-readonly-gitops-dns-diagnosis",
  "homeops-template-structure-exploration",
  "homeops-worktree-handoff",
  "homeops-secret-backed-integration",
  "homeops-critical-security-discovery",
]
