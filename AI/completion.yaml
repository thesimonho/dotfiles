# Completion model for cursortab.nvim (https://github.com/cursortab/cursortab.nvim).
# Started by nvim on launch; see nvim/lua/plugins/AI.lua, which must be edited
# in step with this file when the model changes.
#
# Linux only. macOS runs the same llama-server natively because Metal has no
# passthrough into a container, so a containerised server there is CPU-only.
#
#   docker compose --file AI/completion.yaml up --detach fim
name: completion

services:
  # Fill-in-the-middle rather than next-edit, chosen on decode length: the
  # next-edit models re-emit a whole rewritten span (112-206 tokens, 2.6-4.0s
  # on the M1 Pro, most cancelled by the next keystroke) where FIM emits a line
  # or two. Quantization cannot fix a token count, so prefer a FIM model here.
  fim:
    # Not unless-stopped: a daemon restart should not silently reload several GB
    # of weights, and a crash should stay visible rather than loop.
    restart: "no"
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10156
    # Docker's device-request path injects libcuda but CUDA init still fails;
    # the explicit runtime exposes a working device.
    runtime: nvidia
    # HF_HOME, not LLAMA_CACHE: -hf downloads land in the hub cache layout.
    # LLAMA_CACHE is set too since older builds honour it.
    environment:
      HF_HOME: /models
      LLAMA_CACHE: /models
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # Shares the host huggingface cache, so `hf download <repo> <file>` writes
    # exactly the path -hf looks for and pre-warms a new model far faster than
    # -hf's single connection:
    #
    #   hf download QuantFactory/Qwen2.5-Coder-1.5B-GGUF Qwen2.5-Coder-1.5B.Q6_K.gguf
    volumes:
      - "$HOME/.cache/huggingface:/models"
      - "./scripts/container-health-progress.sh:/usr/local/bin/container-health-progress:ro"
    # Runs as the invoking user so cached blobs stay writable by `hf download`
    # on the host; the image would otherwise write them as root.
    user: "${UID:-1000}:${GID:-1000}"
    # Published because the client is a host process, not a container.
    ports:
      - 127.0.0.1:8000:8000
    command:
      - -hf
      - QuantFactory/Qwen2.5-Coder-1.5B-GGUF:Q6_K
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Sized against cursortab's provider.context_size (1024); anything beyond
      # that is KV allocated and never touched.
      - --ctx-size
      - "8192"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --n-gpu-layers
      - auto
      - --flash-attn
      - auto
      # One slot, not the default 4: one editor, and 4 slots quadruple KV.
      - --parallel
      - "1"
    healthcheck:
      test:
        - CMD
        - sh
        - /usr/local/bin/container-health-progress
        - http://127.0.0.1:8000/health
        - /models
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
